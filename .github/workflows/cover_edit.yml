name: cover_edit

# Édite l'art d'un run précédent via FLUX Kontext (retouche ciblée : on garde
# l'image et on ne modifie que ce que décrit edit_prompt), puis recompose la
# couverture KDP et publie les aperçus. Lancement manuel.

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID contenant l'art à éditer (artifact cycle404-covers)"
        required: true
      concept:
        description: "Concept (nom du fichier art sans extension)"
        default: "fenetre_auditorium"
        required: true
      edit_prompt:
        description: "Instruction d'édition (anglais recommandé)"
        required: true
      title:
        default: "CYCLE 404"
        required: true
      tagline:
        default: ""
        required: false
      author:
        default: "SHIRO KEGESU"
        required: true
      pages:
        default: "400"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse — scripts uniquement)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/covers
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --quiet requests Pillow fonttools

      - name: Prepare fonts (Bebas Neue, Oswald, Cormorant Italic)
        run: |
          mkdir -p assets/cover_fonts
          npm install --no-save @fontsource/bebas-neue @fontsource/oswald @fontsource/cormorant-garamond
          python - <<'PY'
          from fontTools.ttLib import TTFont
          conv = {
            "node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff": "assets/cover_fonts/BebasNeue-Regular.ttf",
            "node_modules/@fontsource/oswald/files/oswald-latin-600-normal.woff": "assets/cover_fonts/Oswald-SemiBold.ttf",
            "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff": "assets/cover_fonts/Cormorant-Italic.ttf",
          }
          for s, d in conv.items():
              f = TTFont(s); f.flavor = None; f.save(d); print("OK", d)
          PY

      - name: Download art from source run
        uses: actions/download-artifact@v4
        with:
          name: cycle404-covers
          path: prev
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Edit art (Runware FLUX Kontext)
        env:
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
          CONCEPT: ${{ github.event.inputs.concept }}
          EDIT_PROMPT: ${{ github.event.inputs.edit_prompt }}
        run: |
          set -e
          mkdir -p art
          if [ ! -f "prev/art/${CONCEPT}.png" ]; then
            echo "::error::prev/art/${CONCEPT}.png introuvable dans l'artifact source"
            find prev -type f | sort
            exit 1
          fi
          python scripts/covers/runware_edit.py \
            --in "prev/art/${CONCEPT}.png" \
            --out "art/${CONCEPT}.png" \
            --prompt "$EDIT_PROMPT"

      - name: Compose cover (typo + wrap KDP)
        env:
          CONCEPT: ${{ github.event.inputs.concept }}
        run: |
          set -e
          mkdir -p output/covers
          python scripts/covers/compose_cover.py \
            --art "art/${CONCEPT}.png" \
            --concept "${CONCEPT}" \
            --title "${{ github.event.inputs.title }}" \
            --tagline "${{ github.event.inputs.tagline }}" \
            --author "${{ github.event.inputs.author }}" \
            --pages "${{ github.event.inputs.pages }}" \
            --out output/covers

      - name: Contact sheet + vignettes 100px
        run: |
          python scripts/covers/contact_sheet.py \
            --covers output/covers \
            --concepts "${{ github.event.inputs.concept }}"

      - name: List outputs
        run: find output/covers art -type f -printf '%p  %k Ko\n' | sort

      - name: Upload edited covers artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle404-covers-edited
          path: |
            output/covers/**
            art/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish lightweight previews to branch covers-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/pv && mkdir -p /tmp/pv
          cp output/covers/contact_sheet.png /tmp/pv/ 2>/dev/null || true
          cp output/covers/thumbnails_100px.png /tmp/pv/ 2>/dev/null || true
          for d in output/covers/*/; do
            c="$(basename "$d")"
            [ -f "$d/preview_montage.png" ] && cp "$d/preview_montage.png" "/tmp/pv/${c}_edit_montage.png"
            [ -f "$d/cover_ebook.jpg" ]     && cp "$d/cover_ebook.jpg"     "/tmp/pv/${c}_edit_ebook.jpg"
          done
          cd /tmp/pv
          git init -q
          git checkout -q -b covers-output
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "previews cover_edit run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" covers-output
          echo "Previews édités poussés sur covers-output."
