name: cover_generator

# Génère les couvertures KDP « CYCLE 404 » (3 concepts) via Runware FLUX,
# composite la typo + les wraps paperback, et publie tout en artifact.
# Lancement manuel uniquement.

on:
  workflow_dispatch:
    inputs:
      concepts:
        description: "Concepts à générer (séparés par des virgules)"
        default: "decor_dechire,chambre_plateau,saul_bass,oeil_ecran"
        required: true
      title:
        description: "Titre"
        default: "CYCLE 404"
        required: true
      tagline:
        description: "Accroche (italique) — vide pour l'instant, ajoutée plus tard"
        default: ""
        required: false
      author:
        description: "Nom d'auteur"
        default: "SHIRO KEGESU"
        required: true
      pages:
        description: "Nombre de pages (épaisseur du dos)"
        default: "400"
        required: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse — scripts uniquement, dépôt lourd)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/covers
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --quiet requests Pillow fonttools

      - name: Prepare fonts (Bebas Neue, Oswald, Cormorant Italic)
        run: |
          mkdir -p assets/cover_fonts
          npm install --no-save @fontsource/bebas-neue @fontsource/oswald @fontsource/cormorant-garamond
          python - <<'PY'
          from fontTools.ttLib import TTFont
          conv = {
            "node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff": "assets/cover_fonts/BebasNeue-Regular.ttf",
            "node_modules/@fontsource/oswald/files/oswald-latin-600-normal.woff": "assets/cover_fonts/Oswald-SemiBold.ttf",
            "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff": "assets/cover_fonts/Cormorant-Italic.ttf",
          }
          for s, d in conv.items():
              f = TTFont(s); f.flavor = None; f.save(d); print("OK", d)
          PY

      - name: Generate art (Runware FLUX)
        env:
          RUNWARE_API_KEY: ${{ secrets.RUNWARE_API_KEY }}
        run: |
          python scripts/covers/runware_cover.py \
            --out art \
            --concepts "${{ github.event.inputs.concepts }}"

      - name: Compose covers (typo + wraps KDP)
        run: |
          set -e
          mkdir -p output/covers
          IFS=',' read -ra CS <<< "${{ github.event.inputs.concepts }}"
          for c in "${CS[@]}"; do
            c="$(echo "$c" | xargs)"
            if [ -f "art/$c.png" ]; then
              python scripts/covers/compose_cover.py \
                --art "art/$c.png" \
                --concept "$c" \
                --title "${{ github.event.inputs.title }}" \
                --tagline "${{ github.event.inputs.tagline }}" \
                --author "${{ github.event.inputs.author }}" \
                --pages "${{ github.event.inputs.pages }}" \
                --out output/covers
            else
              echo "::warning::art/$c.png manquant, concept ignoré"
            fi
          done

      - name: Contact sheet + vignettes 100px
        run: |
          python scripts/covers/contact_sheet.py \
            --covers output/covers \
            --concepts "${{ github.event.inputs.concepts }}"

      - name: List outputs
        run: find output/covers art -type f -printf '%p  %k Ko\n' | sort

      - name: Upload covers artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle404-covers
          path: |
            output/covers/**
            art/**
          if-no-files-found: error
          retention-days: 14

      - name: Publish lightweight previews to branch covers-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/pv && mkdir -p /tmp/pv
          cp output/covers/contact_sheet.png /tmp/pv/ 2>/dev/null || true
          cp output/covers/thumbnails_100px.png /tmp/pv/ 2>/dev/null || true
          for d in output/covers/*/; do
            c="$(basename "$d")"
            [ -f "$d/preview_montage.png" ] && cp "$d/preview_montage.png" "/tmp/pv/${c}_montage.png"
            [ -f "$d/cover_ebook.jpg" ]     && cp "$d/cover_ebook.jpg"     "/tmp/pv/${c}_ebook.jpg"
          done
          cd /tmp/pv
          git init -q
          git checkout -q -b covers-output
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "previews cover_generator run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" covers-output
          echo "Previews poussés sur la branche covers-output."
