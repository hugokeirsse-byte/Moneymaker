name: Publication Prep — détourage circulaire transparent

on:
  workflow_dispatch:
    inputs:
      src_dir:
        description: 'Dossier source (ex: produits/worldcup2026_flag_patches)'
        required: true
      dst_dir:
        description: 'Dossier destination (ex: produits/worldcup2026_flag_patches_transparent)'
        required: true

permissions:
  contents: write

jobs:
  cutout:
    name: Détourage circulaire (fond transparent, sans perte)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts
            produits
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install -q numpy Pillow

      - name: Détourage par lot (0 €)
        run: |
          python scripts/cutout_circle.py --batch \
            "${{ github.event.inputs.src_dir }}" \
            "${{ github.event.inputs.dst_dir }}"

      - name: Commit et push
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          git rebase --abort 2>/dev/null || true
          git merge --abort 2>/dev/null || true
          BR=$(git rev-parse --abbrev-ref HEAD)
          git add "${{ github.event.inputs.dst_dir }}"
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "produits: détourage transparent ${{ github.event.inputs.dst_dir }} — $(date -u +'%Y-%m-%d %H:%M UTC')"
          DELAY=2
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Échec push ($attempt/4) — retry dans ${DELAY}s"
            sleep $DELAY; DELAY=$((DELAY * 2))
          done
          echo "::error::push impossible après 4 tentatives"
          exit 1

      - name: Artefact de secours
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cutout-${{ github.run_number }}
          path: ${{ github.event.inputs.dst_dir }}
