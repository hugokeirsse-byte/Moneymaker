name: cover_finalize

# Finalisation KDP : applique l'accroche + la 4e de couverture + le dos + les
# exports définitifs sur l'art validé d'un run précédent (aucune regénération).

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Run ID contenant l'art validé"
        required: true
      source_artifact:
        description: "Nom de l'artifact source"
        default: "cycle404-covers-edited"
        required: true
      concept:
        default: "fenetre_auditorium"
        required: true
      title:
        default: "CYCLE 404"
        required: true
      author:
        default: "SHIRO KEGESU"
        required: true
      pages:
        default: "400"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse — scripts uniquement)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/covers
          sparse-checkout-cone-mode: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: python -m pip install --quiet Pillow fonttools

      - name: Prepare fonts (Bebas, Oswald 300/400/600, Cormorant Italic)
        run: |
          mkdir -p assets/cover_fonts
          npm install --no-save @fontsource/bebas-neue @fontsource/oswald @fontsource/cormorant-garamond
          python - <<'PY'
          from fontTools.ttLib import TTFont
          conv = {
            "node_modules/@fontsource/bebas-neue/files/bebas-neue-latin-400-normal.woff": "assets/cover_fonts/BebasNeue-Regular.ttf",
            "node_modules/@fontsource/oswald/files/oswald-latin-600-normal.woff": "assets/cover_fonts/Oswald-SemiBold.ttf",
            "node_modules/@fontsource/oswald/files/oswald-latin-400-normal.woff": "assets/cover_fonts/Oswald-Regular.ttf",
            "node_modules/@fontsource/oswald/files/oswald-latin-300-normal.woff": "assets/cover_fonts/Oswald-Light.ttf",
            "node_modules/@fontsource/cormorant-garamond/files/cormorant-garamond-latin-500-italic.woff": "assets/cover_fonts/Cormorant-Italic.ttf",
          }
          for s, d in conv.items():
              f = TTFont(s); f.flavor = None; f.save(d); print("OK", d)
          PY

      - name: Download art from source run
        uses: actions/download-artifact@v4
        with:
          name: ${{ github.event.inputs.source_artifact }}
          path: prev
          run-id: ${{ github.event.inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize (accroche + 4e + dos + exports)
        env:
          CONCEPT: ${{ github.event.inputs.concept }}
        run: |
          set -e
          mkdir -p output/final
          if [ ! -f "prev/art/${CONCEPT}.png" ]; then
            echo "::error::prev/art/${CONCEPT}.png introuvable dans l'artifact source"
            find prev -type f | sort
            exit 1
          fi
          python scripts/covers/finalize_cover.py \
            --art "prev/art/${CONCEPT}.png" \
            --textjson scripts/covers/text/cycle404_text.json \
            --title "${{ github.event.inputs.title }}" \
            --author "${{ github.event.inputs.author }}" \
            --pages "${{ github.event.inputs.pages }}" \
            --out output/final

      - name: List outputs
        run: find output/final -type f -printf '%p  %k Ko\n' | sort

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: cycle404-final
          path: output/final/**
          if-no-files-found: error
          retention-days: 30

      - name: Publish previews to branch covers-output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          rm -rf /tmp/pv && mkdir -p /tmp/pv
          cp output/final/cover_ebook_final.jpg      /tmp/pv/ 2>/dev/null || true
          cp output/final/preview_montage.png        /tmp/pv/final_preview_montage.png 2>/dev/null || true
          cp output/final/cover_paperback_final.png  /tmp/pv/final_wrap.png 2>/dev/null || true
          cd /tmp/pv
          git init -q
          git checkout -q -b covers-output
          git add -A
          git -c user.name=ci -c user.email=ci@example.com commit -q -m "finalisation run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" covers-output
          echo "Previews finales poussées sur covers-output."
