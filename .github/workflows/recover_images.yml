name: Utilitaires Python (0€ génération)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'make_collection | gen_listings_corpus | gen_listings_produits | gen_niche_jokes | cleanup_pride'
        required: true
        default: 'make_collection'
      limit:
        description: 'make_collection : nb max (0 = tous)'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  util:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            data
            assets
            reports
            produits/typographies
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install -q Pillow numpy google-genai requests

      - name: Exécuter la tâche
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: |
          set -e
          TASK="${{ github.event.inputs.task }}"
          LIM="${{ github.event.inputs.limit || '0' }}"
          mkdir -p reports/contact reports/listings assets/fonts
          if [ "$TASK" = "make_collection" ]; then
            curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/kaushanscript/KaushanScript-Regular.ttf" -o assets/fonts/Kaushan_Script.ttf
            python3 -c "import json; d=json.load(open('data/typo_collection.json')); [i.update({'font':'Kaushan Script'}) for i in d['items']]; json.dump(d, open('data/_typo_run.json','w'), ensure_ascii=False)"
            find produits/typographies -name '*.png' -delete 2>/dev/null || true
            python scripts/make_collection.py --data data/_typo_run.json \
              --out produits/typographies \
              --sheet reports/contact/typo_collection.png --limit "$LIM"
          elif [ "$TASK" = "gen_listings_corpus" ]; then
            python scripts/gen_listings_gemini.py --corpus data/typo_collection.json
          elif [ "$TASK" = "gen_listings_produits" ]; then
            python scripts/gen_listings_gemini.py --produits
          elif [ "$TASK" = "gen_niche_jokes" ]; then
            python scripts/gen_niche_jokes_gemini.py
          elif [ "$TASK" = "cleanup_pride" ]; then
            python scripts/cleanup_pride_strays.py
          else
            echo "tache inconnue : $TASK"; exit 1
          fi

      - name: Commit et push
        if: ${{ github.event.inputs.task != 'cleanup_pride' }}
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          git rebase --abort 2>/dev/null || true
          BR=$(git rev-parse --abbrev-ref HEAD)
          git add -A produits/typographies reports 2>/dev/null || true
          if git diff --staged --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "typo/listings: ${{ github.event.inputs.task }} — $(date -u +'%Y-%m-%d %H:%M UTC')"
          DELAY=2
          for a in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $DELAY; DELAY=$((DELAY*2))
          done
          echo "::error::push impossible"; exit 1

      - name: Artefact (contact sheet + listings + rapports)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: util-${{ github.run_number }}
          path: |
            reports
