name: Utilitaires Python (0€ génération)

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'make_collection | gen_listings_corpus | gen_listings_produits | gen_niche_jokes | gen_wordcloud | gen_mosaic | gen_hidden | cleanup_pride'
        required: true
        default: 'make_collection'
      limit:
        description: 'make_collection : nb max (0 = tous)'
        required: false
        default: '0'
      wc_words:
        description: 'gen_wordcloud : mots séparés par des virgules (sinon utiliser wc_report)'
        required: false
        default: ''
      wc_report:
        description: 'gen_wordcloud : chemin reports/niche_jokes_ranked_*.json'
        required: false
        default: ''
      wc_niche:
        description: 'gen_wordcloud : filtre de niche (avec wc_report)'
        required: false
        default: ''
      wc_mask:
        description: 'gen_wordcloud : heart | star | hexagon | circle | diamond | arrow_up'
        required: false
        default: 'heart'
      wc_colors:
        description: 'gen_wordcloud : rainbow | black | sunset | ocean | forest | candy'
        required: false
        default: 'rainbow'
      mosaic_symbol:
        description: 'gen_mosaic : grande forme — peace|anarchy|heart|recycle|female|male|infinity|star|finger|lightning|smiley'
        required: false
        default: 'heart'
      mosaic_tiles:
        description: 'gen_mosaic : petit symbole répété (vide = identique). Ex: symbol=finger, tiles=heart'
        required: false
        default: ''
      mosaic_colors:
        description: 'gen_mosaic : candy | tropical | sunset | ocean | forest | pride | rose | grape | sky | mint'
        required: false
        default: 'candy'
      mosaic_label:
        description: 'gen_mosaic : mot écrit dessous, en petits symboles (ex. LOVE)'
        required: false
        default: ''
      hidden_text:
        description: 'gen_hidden : phrase visible (ex. FRIENDSHIP)'
        required: false
        default: ''
      hidden_word:
        description: 'gen_hidden : message caché surligné (ex. ENDS)'
        required: false
        default: ''
      hidden_color:
        description: 'gen_hidden : couleur d''accent (hex, ex. #e63946)'
        required: false
        default: '#e63946'

permissions:
  contents: write

jobs:
  util:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            data
            assets
            reports
            produits/typographies
            produits/word_shapes
            produits/symbol_mosaics
            produits/hidden
          sparse-checkout-cone-mode: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dépendances
        run: pip install -q Pillow numpy google-genai requests wordcloud

      - name: Exécuter la tâche
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          WC_WORDS: ${{ github.event.inputs.wc_words }}
          WC_REPORT: ${{ github.event.inputs.wc_report }}
          WC_NICHE: ${{ github.event.inputs.wc_niche }}
          WC_MASK: ${{ github.event.inputs.wc_mask }}
          WC_COLORS: ${{ github.event.inputs.wc_colors }}
          MOSAIC_SYMBOL: ${{ github.event.inputs.mosaic_symbol }}
          MOSAIC_TILES: ${{ github.event.inputs.mosaic_tiles }}
          MOSAIC_COLORS: ${{ github.event.inputs.mosaic_colors }}
          MOSAIC_LABEL: ${{ github.event.inputs.mosaic_label }}
          HIDDEN_TEXT: ${{ github.event.inputs.hidden_text }}
          HIDDEN_WORD: ${{ github.event.inputs.hidden_word }}
          HIDDEN_COLOR: ${{ github.event.inputs.hidden_color }}
        run: |
          set -e
          TASK="${{ github.event.inputs.task }}"
          LIM="${{ github.event.inputs.limit || '0' }}"
          mkdir -p reports/contact reports/listings assets/fonts produits/word_shapes produits/symbol_mosaics produits/hidden
          if [ "$TASK" = "make_collection" ]; then
            curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/kaushanscript/KaushanScript-Regular.ttf" -o assets/fonts/Kaushan_Script.ttf
            python3 -c "import json; d=json.load(open('data/typo_collection.json')); [i.update({'font':'Kaushan Script'}) for i in d['items']]; json.dump(d, open('data/_typo_run.json','w'), ensure_ascii=False)"
            find produits/typographies -name '*.png' -delete 2>/dev/null || true
            python scripts/make_collection.py --data data/_typo_run.json \
              --out produits/typographies \
              --sheet reports/contact/typo_collection.png --limit "$LIM"
          elif [ "$TASK" = "gen_listings_corpus" ]; then
            python scripts/gen_listings_gemini.py --corpus data/typo_collection.json
          elif [ "$TASK" = "gen_listings_produits" ]; then
            python scripts/gen_listings_gemini.py --produits
          elif [ "$TASK" = "gen_niche_jokes" ]; then
            python scripts/gen_niche_jokes_gemini.py
          elif [ "$TASK" = "gen_wordcloud" ]; then
            curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/kaushanscript/KaushanScript-Regular.ttf" -o assets/fonts/Kaushan_Script.ttf
            ARGS=(--mask "${WC_MASK:-heart}" --colors "${WC_COLORS:-rainbow}" \
                  --font-path assets/fonts/Kaushan_Script.ttf \
                  --out produits/word_shapes --sheet reports/contact/word_shape.png)
            [ -n "$WC_WORDS" ]  && ARGS+=(--words "$WC_WORDS")
            [ -n "$WC_REPORT" ] && ARGS+=(--from-report "$WC_REPORT")
            [ -n "$WC_NICHE" ]  && ARGS+=(--niche "$WC_NICHE")
            python scripts/gen_wordcloud.py "${ARGS[@]}"
          elif [ "$TASK" = "gen_mosaic" ]; then
            curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf" -o assets/fonts/Anton.ttf
            MARGS=(--symbol "${MOSAIC_SYMBOL:-heart}" --colors "${MOSAIC_COLORS:-candy}" \
                   --font-path assets/fonts/Anton.ttf --out produits/symbol_mosaics \
                   --sheet reports/contact/mosaic_${MOSAIC_SYMBOL:-heart}.png)
            [ -n "$MOSAIC_TILES" ] && MARGS+=(--tiles "$MOSAIC_TILES")
            [ -n "$MOSAIC_LABEL" ] && MARGS+=(--label "$MOSAIC_LABEL")
            python scripts/gen_symbol_mosaic.py "${MARGS[@]}"
          elif [ "$TASK" = "gen_hidden" ]; then
            curl -sL "https://raw.githubusercontent.com/google/fonts/main/ofl/anton/Anton-Regular.ttf" -o assets/fonts/Anton.ttf
            python scripts/gen_hidden_message.py --text "$HIDDEN_TEXT" --hidden "$HIDDEN_WORD" \
              --color "${HIDDEN_COLOR:-#e63946}" --font-path assets/fonts/Anton.ttf \
              --out produits/hidden --sheet reports/contact/hidden.png
          elif [ "$TASK" = "cleanup_pride" ]; then
            python scripts/cleanup_pride_strays.py
          else
            echo "tache inconnue : $TASK"; exit 1
          fi

      - name: Commit et push
        if: ${{ github.event.inputs.task != 'cleanup_pride' }}
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          git rebase --abort 2>/dev/null || true
          BR=$(git rev-parse --abbrev-ref HEAD)
          git add -A produits/typographies produits/word_shapes produits/symbol_mosaics produits/hidden reports 2>/dev/null || true
          if git diff --staged --quiet; then echo "Rien a committer."; exit 0; fi
          git commit -m "typo/listings: ${{ github.event.inputs.task }} — $(date -u +'%Y-%m-%d %H:%M UTC')"
          DELAY=2
          for a in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $DELAY; DELAY=$((DELAY*2))
          done
          echo "::error::push impossible"; exit 1

      - name: Artefact (contact sheet + listings + rapports)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: util-${{ github.run_number }}
          path: |
            reports
