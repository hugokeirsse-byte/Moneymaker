name: Maintenance — réorganisation produits

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reorg:
    name: Réorganise produits/ en dossiers thématiques
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (sparse minimal)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Réorganisation + commit via API GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/reorganize_produits.py
