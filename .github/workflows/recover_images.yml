name: Maintenance — réorganisation produits

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  reorg:
    name: Réorganise produits/ en dossiers thématiques
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout (sparse minimal)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Réorganisation (index git, aucun fichier image téléchargé)
        run: python3 scripts/reorganize_produits.py

      - name: Commit et push
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          # commit par plomberie : git commit déclencherait la détection de
          # renommages et téléchargerait les ~700 blobs déplacés (14 Go)
          TREE=$(git write-tree)
          NEW=$(git commit-tree "$TREE" -p HEAD -m "produits: réorganisation en dossiers classés par thème")
          git update-ref "refs/heads/$(git rev-parse --abbrev-ref HEAD)" "$NEW"
          git reset -q --soft "$NEW"
          BR=$(git rev-parse --abbrev-ref HEAD)
          DELAY=2
          for attempt in 1 2 3 4; do
            if git pull --rebase --autostash origin "$BR" && git push origin "$BR"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $DELAY; DELAY=$((DELAY * 2))
          done
          exit 1
