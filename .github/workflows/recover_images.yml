name: Maintenance — nettoyage produits

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  cleanup:
    name: Nettoyage produits/ (pride strays)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (sparse minimal)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: true

      - name: Retrait des slogans dupliqués à la racine de pride/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/cleanup_pride_strays.py
