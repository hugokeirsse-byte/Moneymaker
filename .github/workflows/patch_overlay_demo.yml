name: Patch — Overlay Text Demo (1 image)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overlay:
    name: Test overlay text on ONE patch image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11 + Pillow
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pillow

      - name: Apply overlay to ONE image only
        run: |
          mkdir -p output/redbubble_with_text
          # Pick the very first PNG found in any rb_* expression subfolder
          img=$(find output/rb_*/ -mindepth 2 -maxdepth 2 -name '*.png' \
                  2>/dev/null | grep -v thumbnails | sort | head -1)
          if [ -z "$img" ]; then
            echo "ERROR: no patch PNG found in output/rb_*/" && exit 1
          fi
          expression=$(basename "$(dirname "$img")")
          text=$(echo "$expression" | tr '[:lower:]' '[:upper:]' | tr '_' ' ')
          out="output/redbubble_with_text/${expression}___overlay.png"
          echo "Image  : $img"
          echo "Text   : $text"
          echo "Output : $out"
          python scripts/overlay_patch_text.py "$img" "$text" "$out"
          ls -lh "$out"

      - name: Commit and push result
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          git add output/redbubble_with_text/
          if git diff --staged --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "demo(overlay): 1 image test with embroidery text"
            git pull --rebase --autostash origin HEAD
            git push origin HEAD
          fi

      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: overlay-demo-${{ github.run_number }}
          path: output/redbubble_with_text/
          retention-days: 30
