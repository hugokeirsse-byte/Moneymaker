name: Module 01 — Trend & Niche Discovery

on:
  # Crons désactivés — lancement MANUEL uniquement
  # schedule:
  #   - cron: '0 6 * * *'
  #   - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Mots-clés supplémentaires (virgule)'
        required: false
        default: ''
      categories:
        description: 'Catégories de niches (virgule, vide = toutes)'
        required: false
        default: ''
      fast_mode:
        description: 'Mode rapide'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      depth:
        description: 'Profondeur arbre de niches (1-3)'
        required: false
        default: '2'
      mode:
        description: 'Mode de lancement'
        required: false
        default: 'preview'
        type: choice
        options:
          - 'preview'              # Gemini trends + CdCs + manifest (0 €)
          - 'redbubble-preview'  # CDCs standalone Redbubble (t-shirt, sticker, mug) via Gemini (0 €)
          - 'redbubble-generate' # Génère les images standalone Redbubble (~0.006€ × nb CDCs)
          - 'adobe-stock-preview'  # CDCs optimisés Adobe Stock via Gemini (0 €)
          - 'adobe-stock-generate' # Génère images pour Adobe Stock (~0.006€ × nb CDCs)
          - 'etsy-preview'         # CDCs digital download bundles Etsy via Gemini (0 €)
          - 'etsy-generate'        # Génère images pour bundles Etsy (~0.006€ × nb CDCs)
          - 'audit'              # Note /100 chaque image via Gemini Vision (0 €, RUNWARE non requis)
          - 'archive'            # Archive un CdC accompli (input niche) + régénère un remplaçant (0 €)
          - 'generate-all'       # 1 image de base par CdC (~0.006€ × nb CdCs)
          - 'generate-best'      # Variantes du meilleur CdC auto-sélectionné (~0.05 €)
          - 'generate-elements'  # 10 éléments isolés + assemblage Pillow (~0.06 €)
          - 'generate'           # Images des CdCs approuvées (manifest requis)
          - 'colorize'           # Variantes de couleurs sur images existantes (0 €, Pillow)
          - 'seamless-audit'     # Vérifie + corrige les tuiles non-seamless (mirror quad, 0 €)
          - 'thumbnails'         # Génère vignettes 600×600 JPEG navigables (0 €, git-safe)
          - 'upscale-fix'        # Re-upscale IA Real-ESRGAN images existantes floues (~0.005€/img)
          - 'recover-artifact'   # Récupère les upscales d'un run interrompu (0 €, depuis artefact)
          - 'full'               # Pipeline complet sans génération d'images
      recover_run_id:
        description: 'Run ID de l artefact à récupérer (mode recover-artifact)'
        required: false
        default: ''
      focus:
        description: 'Orientation thématique des CDC (mode preview). Ex: Art Deco animals + anthropomorphized portraits, no vintage'
        required: false
        default: ''
      niche_count:
        description: 'Override niche count (ex: 16 → 20 CDCs total avec 4 crossover). Vide = défaut profil (12).'
        required: false
        default: ''
      manifest_path:
        description: 'Path to approval manifest (relative to repo root)'
        required: false
        default: ''
      approved_niches:
        description: 'Comma-separated list of niche names to approve (alternative to manifest)'
        required: false
        default: ''
      images_per_niche:
        description: 'Number of images per approved CdC'
        required: false
        default: '5'
      niche:
        description: 'Nom exact du CdC à générer (mode generate-best). Vide = meilleur score.'
        required: false
        default: ''
      limit:
        description: 'Nb max de variantes pour generate-best (1 = base uniquement, 0 = toutes). Ex: 1 pour calibrer.'
        required: false
        default: '0'
      palettes:
        description: 'Palettes colorize séparées par virgule (vide = toutes les 8). Ex: dark_moody,pastel_soft,earth_tones'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  discover:
    name: Pipeline Détection de Tendances
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Créer les répertoires nécessaires
        run: mkdir -p reports data output/spoonflower output/redbubble output/adobe_stock output/etsy

      - name: Restaurer la base de données (cache)
        uses: actions/cache@v4
        with:
          path: data/
          key: opportunities-db-${{ github.ref_name }}
          restore-keys: |
            opportunities-db-

      - name: Télécharger l'artefact à récupérer (mode recover-artifact)
        if: ${{ github.event.inputs.mode == 'recover-artifact' && github.event.inputs.recover_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: ./_recovered
          run-id: ${{ github.event.inputs.recover_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Lancer le pipeline
        env:
          # Tendances mondiales temps réel (GEMINI_API_KEY requis)
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          # Orientation thématique des CDC (mode preview)
          MONEYMAKER_FOCUS:     ${{ github.event.inputs.focus || '' }}
          MONEYMAKER_NICHE_COUNT: ${{ github.event.inputs.niche_count || '' }}
          # Runware : injecté si mode génération ou upscale-fix
          RUNWARE_API_KEY:      ${{ (github.event.inputs.mode == 'generate' || github.event.inputs.mode == 'generate-best' || github.event.inputs.mode == 'generate-all' || github.event.inputs.mode == 'generate-elements' || github.event.inputs.mode == 'upscale-fix' || github.event.inputs.mode == 'redbubble-generate' || github.event.inputs.mode == 'adobe-stock-generate' || github.event.inputs.mode == 'etsy-generate') && secrets.RUNWARE_API_KEY || '' }}
          RUNWARE_MODEL:        ${{ secrets.RUNWARE_MODEL || 'runware:101@1' }}
          # Sources optionnelles
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT:    ${{ secrets.REDDIT_USER_AGENT || 'Moneymaker/1.0' }}
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          ETSY_API_KEY:         ${{ secrets.ETSY_API_KEY }}
          DATAFORSEO_LOGIN:     ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:  ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'preview' }}"
          if [ "$MODE" = "preview" ]; then
            echo "=== MODE PREVIEW : Gemini trends + CdCs + manifest (0 €) ==="
            python -m trend_discovery.main preview
          elif [ "$MODE" = "redbubble-preview" ]; then
            echo "=== MODE REDBUBBLE-PREVIEW : CDCs standalone Redbubble (0 €) ==="
            FOCUS_ARG=""
            [ -n "${{ github.event.inputs.focus }}" ] && FOCUS_ARG="--focus '${{ github.event.inputs.focus }}'"
            eval python -m trend_discovery.main preview --market redbubble --output ./reports/redbubble $FOCUS_ARG
          elif [ "$MODE" = "redbubble-generate" ]; then
            echo "=== MODE REDBUBBLE-GENERATE : images standalone Redbubble ==="
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            RB_REPORT=$(ls -t ./reports/redbubble/cahiers_des_charges_*.json 2>/dev/null | head -1)
            if [ -z "$RB_REPORT" ]; then
              echo "ERREUR : aucun rapport Redbubble trouvé. Lancez redbubble-preview d'abord." && exit 1
            fi
            echo "Rapport : $RB_REPORT"
            eval python -m trend_discovery.main generate-all --yes \
              --report "$RB_REPORT" \
              --output ./output/redbubble \
              $LIMIT_ARG
            echo "-- Auto thumbnails Redbubble --"
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/redbubble \
              --output ./output/redbubble/thumbnails || true
          elif [ "$MODE" = "adobe-stock-preview" ]; then
            echo "=== MODE ADOBE-STOCK-PREVIEW : CDCs optimisés Adobe Stock (0 €) ==="
            FOCUS_ARG=""
            [ -n "${{ github.event.inputs.focus }}" ] && FOCUS_ARG="--focus '${{ github.event.inputs.focus }}'"
            eval python -m trend_discovery.main preview --market adobe_stock --output ./reports/adobe_stock $FOCUS_ARG
          elif [ "$MODE" = "adobe-stock-generate" ]; then
            echo "=== MODE ADOBE-STOCK-GENERATE : images pour Adobe Stock ==="
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            AS_REPORT=$(ls -t ./reports/adobe_stock/cahiers_des_charges_*.json 2>/dev/null | head -1)
            if [ -z "$AS_REPORT" ]; then
              echo "ERREUR : aucun rapport Adobe Stock trouvé. Lancez adobe-stock-preview d'abord." && exit 1
            fi
            echo "Rapport : $AS_REPORT"
            eval python -m trend_discovery.main generate-all --yes \
              --report "$AS_REPORT" \
              --output ./output/adobe_stock \
              $LIMIT_ARG
            echo "-- Auto thumbnails Adobe Stock --"
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/adobe_stock \
              --output ./output/adobe_stock/thumbnails || true
          elif [ "$MODE" = "etsy-preview" ]; then
            echo "=== MODE ETSY-PREVIEW : CDCs digital download bundles Etsy (0 €) ==="
            FOCUS_ARG=""
            [ -n "${{ github.event.inputs.focus }}" ] && FOCUS_ARG="--focus '${{ github.event.inputs.focus }}'"
            eval python -m trend_discovery.main preview --market etsy --output ./reports/etsy $FOCUS_ARG
          elif [ "$MODE" = "etsy-generate" ]; then
            echo "=== MODE ETSY-GENERATE : images pour bundles Etsy ==="
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            ET_REPORT=$(ls -t ./reports/etsy/cahiers_des_charges_*.json 2>/dev/null | head -1)
            if [ -z "$ET_REPORT" ]; then
              echo "ERREUR : aucun rapport Etsy trouvé. Lancez etsy-preview d'abord." && exit 1
            fi
            echo "Rapport : $ET_REPORT"
            eval python -m trend_discovery.main generate-all --yes \
              --report "$ET_REPORT" \
              --output ./output/etsy \
              $LIMIT_ARG
            echo "-- Auto thumbnails Etsy --"
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/etsy \
              --output ./output/etsy/thumbnails || true
          elif [ "$MODE" = "audit" ]; then
            echo "=== MODE AUDIT : note Gemini Vision /100 par image ==="
            python -m trend_discovery.main audit
          elif [ "$MODE" = "archive" ]; then
            echo "=== MODE ARCHIVE : archive CdC accompli + régénère un remplaçant ==="
            if [ -z "${{ github.event.inputs.niche }}" ]; then
              echo "ERREUR : l'input 'niche' est requis pour le mode archive." && exit 1
            fi
            eval python -m trend_discovery.main archive --niche "'${{ github.event.inputs.niche }}'"
          elif [ "$MODE" = "generate-all" ]; then
            echo "=== MODE GENERATE-ALL : 1 image de base par CdC ==="
            NICHE_ARG=""
            LIMIT_ARG=""
            [ -n "${{ github.event.inputs.niche }}" ] && NICHE_ARG="--niche '${{ github.event.inputs.niche }}'"
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            eval python -m trend_discovery.main generate-all --yes $NICHE_ARG $LIMIT_ARG
            echo "-- Auto thumbnails --"
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/spoonflower \
              --colorways ./output/colorways \
              --uploads ./output/uploads/base \
              --output ./output/thumbnails
          elif [ "$MODE" = "generate-best" ]; then
            echo "=== MODE GENERATE-BEST : variantes du meilleur CdC auto-sélectionné ==="
            NICHE_ARG=""
            LIMIT_ARG=""
            [ -n "${{ github.event.inputs.niche }}" ] && NICHE_ARG="--niche '${{ github.event.inputs.niche }}'"
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            eval python -m trend_discovery.main generate --best --yes $NICHE_ARG $LIMIT_ARG
          elif [ "$MODE" = "generate-elements" ]; then
            echo "=== MODE GENERATE-ELEMENTS : 10 éléments + assemblage Pillow ==="
            NICHE_ARG=""
            [ -n "${{ github.event.inputs.niche }}" ] && NICHE_ARG="--niche '${{ github.event.inputs.niche }}'"
            eval python -m trend_discovery.main generate-elements --yes $NICHE_ARG
          elif [ "$MODE" = "colorize" ]; then
            echo "=== MODE COLORIZE : variantes HSV (rotation teinte, Pillow, 0 coût) ==="
            PALETTE_ARG=""
            [ -n "${{ github.event.inputs.palettes }}" ] && PALETTE_ARG="--palettes '${{ github.event.inputs.palettes }}'"
            echo "-- Colorize pipeline images --"
            eval python -m trend_discovery.main colorize --yes \
              --input ./output/spoonflower \
              --output ./output/colorways \
              $PALETTE_ARG
            echo "-- Colorize user uploads --"
            eval python -m trend_discovery.main colorize --yes \
              --input ./output/uploads/base \
              --output ./output/uploads/colorways \
              $PALETTE_ARG || echo "(no uploads found, skipped)"
          elif [ "$MODE" = "seamless-audit" ]; then
            echo "=== MODE SEAMLESS-AUDIT : vérification + correction mirror quad ==="
            echo "-- Audit pipeline images (overwrite en place) --"
            python -m trend_discovery.main seamless-audit --yes --overwrite \
              --input ./output/spoonflower \
              --output ./output/spoonflower
            echo "-- Audit user uploads --"
            python -m trend_discovery.main seamless-audit --yes --overwrite \
              --input ./output/uploads/base \
              --output ./output/uploads/base || echo "(no uploads found, skipped)"
          elif [ "$MODE" = "thumbnails" ]; then
            echo "=== MODE THUMBNAILS : vignettes JPEG navigables ==="
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/spoonflower \
              --colorways ./output/colorways \
              --uploads ./output/uploads/base \
              --output ./output/thumbnails
          elif [ "$MODE" = "upscale-fix" ]; then
            echo "=== MODE UPSCALE-FIX : re-upscale IA Real-ESRGAN images existantes ==="
            rm -f reports/upscale_debug.log
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            # commit-every 8 : sauvegarde + push incrémental (reprise après timeout, petits push)
            echo "-- Re-upscale pipeline images (commit incrémental) --"
            python -m trend_discovery.generators.upscale_existing \
              --input ./output/spoonflower \
              --commit-every 8 \
              $LIMIT_ARG
            echo "-- Re-upscale user uploads (commit incrémental) --"
            python -m trend_discovery.generators.upscale_existing \
              --input ./output/uploads/base \
              --commit-every 8 \
              $LIMIT_ARG || echo "(no uploads found, skipped)"
            echo "-- Thumbnails post-upscale --"
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/spoonflower \
              --colorways ./output/colorways \
              --uploads ./output/uploads/base \
              --output ./output/thumbnails
          elif [ "$MODE" = "recover-artifact" ]; then
            echo "=== MODE RECOVER-ARTIFACT : récupère les upscales d'un run interrompu (0 €) ==="
            python -m trend_discovery.generators.recover_artifact \
              --artifact-dir ./_recovered \
              --subdirs output/spoonflower,output/uploads/base
            echo "-- Thumbnails post-récupération --"
            python -m trend_discovery.main thumbnails \
              --pipeline ./output/spoonflower \
              --colorways ./output/colorways \
              --uploads ./output/uploads/base \
              --output ./output/thumbnails
          elif [ "$MODE" = "generate" ]; then
            echo "=== MODE GENERATE : génération des images approuvées ==="
            python -m trend_discovery.main generate \
              --manifest "${{ inputs.manifest_path }}" \
              --approve "${{ inputs.approved_niches }}" \
              --images ${{ inputs.images_per_niche || '5' }} \
              --yes
          else
            ARGS=""
            [ -n "${{ github.event.inputs.keywords }}"   ] && ARGS="$ARGS --keywords '${{ github.event.inputs.keywords }}'"
            [ -n "${{ github.event.inputs.categories }}" ] && ARGS="$ARGS --categories '${{ github.event.inputs.categories }}'"
            [ "${{ github.event.inputs.fast_mode }}" = "true" ] && ARGS="$ARGS --fast"
            [ -n "${{ github.event.inputs.depth }}" ] && ARGS="$ARGS --depth ${{ github.event.inputs.depth }}"
            echo "=== MODE $MODE : pipeline complet ==="
            eval python -m trend_discovery.main $ARGS
          fi

      - name: Commit et push des rapports + images
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          git add reports/ output/ data/approvals/ 2>/dev/null || git add reports/ output/
          if git diff --staged --quiet; then
            echo "Aucun nouveau rapport à commiter."
          else
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "report(pipeline): trends + images Spoonflower — ${DATE}"
            # Stash les fichiers non-stagés avant le rebase pour éviter le blocage
            git stash --include-untracked 2>/dev/null || true
            git pull --rebase origin HEAD
            git push origin HEAD
            git stash pop 2>/dev/null || true
          fi

      - name: Upload rapports et images comme artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-${{ github.run_number }}
          path: |
            reports/
            output/spoonflower/
            output/redbubble/
            output/adobe_stock/
            output/etsy/
            output/colorways/
            output/uploads/colorways/
            output/thumbnails/
          retention-days: 90
