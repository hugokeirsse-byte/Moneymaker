name: Module 01 — Trend & Niche Discovery

on:
  # Crons désactivés — lancement MANUEL uniquement
  # schedule:
  #   - cron: '0 6 * * *'
  #   - cron: '0 18 * * *'
  workflow_dispatch:
    inputs:
      keywords:
        description: 'Mots-clés supplémentaires (virgule)'
        required: false
        default: ''
      categories:
        description: 'Catégories de niches (virgule, vide = toutes)'
        required: false
        default: ''
      fast_mode:
        description: 'Mode rapide'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']
      depth:
        description: 'Profondeur arbre de niches (1-3)'
        required: false
        default: '2'
      confirm_paid:
        description: 'GARDE-FOU : taper "yes" pour autoriser la génération payante Runware. Sans ça, AUCUN appel API payant.'
        required: false
        default: 'no'
      mode:
        description: 'Mode de lancement'
        required: false
        default: 'preview'
        type: choice
        options:
          - 'preview'
          - 'redbubble-preview'
          - 'redbubble-generate'
          - 'adobe-stock-preview'
          - 'adobe-stock-generate'
          - 'etsy-preview'
          - 'etsy-generate'
          - 'audit'
          - 'archive'
          - 'generate-all'
          - 'generate-best'
          - 'generate-elements'
          - 'generate'
          - 'colorize'
          - 'bg-remove'
          - 'text-apply'
          - 'text-fix'
          - 'assemble'
          - 'seamless-audit'
          - 'thumbnails'
          - 'listings'
          - 'upscale-fix'
          - 'recover-artifact'
          - 'full'
      report_path:
        description: 'Chemin exact vers le rapport CDC (redbubble-generate). Vide = dernier JSON alphabétiquement.'
        required: false
        default: ''
      recover_run_id:
        description: 'Run ID de l artefact à récupérer (mode recover-artifact)'
        required: false
        default: ''
      focus:
        description: 'Orientation thématique des CDC (mode preview).'
        required: false
        default: ''
      niche_count:
        description: 'Override niche count. Vide = défaut profil (12).'
        required: false
        default: ''
      manifest_path:
        description: 'Path to approval manifest (relative to repo root)'
        required: false
        default: ''
      approved_niches:
        description: 'Comma-separated list of niche names to approve (alternative to manifest)'
        required: false
        default: ''
      images_per_niche:
        description: 'Number of images per approved CdC'
        required: false
        default: '5'
      niche:
        description: 'Nom exact du CdC à générer (mode generate-best). Vide = meilleur score.'
        required: false
        default: ''
      limit:
        description: 'Nb max de variantes (1 = base uniquement, 0 = toutes).'
        required: false
        default: '0'
      palettes:
        description: 'Palettes colorize séparées par virgule (vide = toutes les 8).'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  discover:
    name: Pipeline Détection de Tendances
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # filter blob:none : ne télécharge PAS les blobs upfront.
          # Le repo dépasse plusieurs Go d'images commitées — sans ce filtre
          # le checkout échoue avec early EOF même en shallow clone.
          fetch-depth: 1
          filter: blob:none

      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Créer les répertoires nécessaires
        run: mkdir -p reports data output/spoonflower output/redbubble output/redbubble_idioms output/redbubble_fixed output/redbubble_with_text output/adobe_stock output/etsy output/colorways output/thumbnails

      - name: Restaurer la base de données (cache)
        uses: actions/cache@v4
        with:
          path: data/
          key: opportunities-db-${{ github.ref_name }}
          restore-keys: |
            opportunities-db-

      - name: Télécharger l'artefact à récupérer (mode recover-artifact)
        if: ${{ github.event.inputs.mode == 'recover-artifact' && github.event.inputs.recover_run_id != '' }}
        uses: actions/download-artifact@v4
        with:
          path: ./_recovered
          run-id: ${{ github.event.inputs.recover_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          merge-multiple: true

      - name: Lancer le pipeline
        env:
          GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
          MONEYMAKER_FOCUS:     ${{ github.event.inputs.focus || '' }}
          MONEYMAKER_NICHE_COUNT: ${{ github.event.inputs.niche_count || '' }}
          RUNWARE_API_KEY:      ${{ (github.event.inputs.confirm_paid == 'yes') && (github.event.inputs.mode == 'generate' || github.event.inputs.mode == 'generate-best' || github.event.inputs.mode == 'generate-all' || github.event.inputs.mode == 'generate-elements' || github.event.inputs.mode == 'upscale-fix' || github.event.inputs.mode == 'redbubble-generate' || github.event.inputs.mode == 'adobe-stock-generate' || github.event.inputs.mode == 'etsy-generate') && secrets.RUNWARE_API_KEY || '' }}
          RUNWARE_MODEL:        ${{ secrets.RUNWARE_MODEL || 'runware:101@1' }}
          REDDIT_CLIENT_ID:     ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USER_AGENT:    ${{ secrets.REDDIT_USER_AGENT || 'Moneymaker/1.0' }}
          YOUTUBE_API_KEY:      ${{ secrets.YOUTUBE_API_KEY }}
          ETSY_API_KEY:         ${{ secrets.ETSY_API_KEY }}
          DATAFORSEO_LOGIN:     ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD:  ${{ secrets.DATAFORSEO_PASSWORD }}
          OPENAI_API_KEY:       ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY:    ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'preview' }}"
          if [ "$MODE" = "preview" ]; then
            echo "=== MODE PREVIEW ==="
            python -m trend_discovery.main preview
          elif [ "$MODE" = "redbubble-preview" ]; then
            echo "=== MODE REDBUBBLE-PREVIEW ==="
            FOCUS_ARG=""
            [ -n "${{ github.event.inputs.focus }}" ] && FOCUS_ARG="--focus '${{ github.event.inputs.focus }}'"
            eval python -m trend_discovery.main preview --market redbubble --output ./reports/redbubble $FOCUS_ARG
          elif [ "$MODE" = "redbubble-generate" ]; then
            echo "=== MODE REDBUBBLE-GENERATE ==="
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            if [ -n "${{ github.event.inputs.report_path }}" ]; then
              RB_REPORT="${{ github.event.inputs.report_path }}"
              echo "Rapport ciblé : $RB_REPORT"
            else
              RB_REPORT=$(ls ./reports/redbubble/cahiers_des_charges_*.json 2>/dev/null | sort | tail -1)
            fi
            if [ -z "$RB_REPORT" ]; then
              echo "ERREUR : aucun rapport Redbubble trouvé." && exit 1
            fi
            RB_BASENAME=$(basename "$RB_REPORT" .json | sed 's/^cahiers_des_charges_//')
            RB_OUTPUT="./output/rb_${RB_BASENAME}"
            mkdir -p "$RB_OUTPUT"
            echo "Rapport : $RB_REPORT → sortie : $RB_OUTPUT"
            git config user.name  "Moneymaker Bot"
            git config user.email "bot@moneymaker.auto"
            (
              while true; do
                sleep 180
                git add "$RB_OUTPUT" 2>/dev/null || true
                if ! git diff --staged --quiet 2>/dev/null; then
                  git commit -q -m "wip(images): sauvegarde incrémentale $(date -u +%H:%M)" || true
                  git pull -q --rebase --autostash origin HEAD 2>/dev/null || true
                  git push -q origin HEAD 2>/dev/null || true
                fi
              done
            ) &
            KEEPER_PID=$!
            trap "kill $KEEPER_PID 2>/dev/null || true" EXIT
            eval python -m trend_discovery.main generate-all --yes \
              --report "$RB_REPORT" \
              --output "$RB_OUTPUT" \
              $LIMIT_ARG
            kill $KEEPER_PID 2>/dev/null || true
            echo "-- Rangement en sous-dossiers --"
            for f in "$RB_OUTPUT"/*.png; do
              [ -e "$f" ] || continue
              base=$(basename "$f")
              expr="${base%%___*}"
              mkdir -p "$RB_OUTPUT/$expr"
              mv "$f" "$RB_OUTPUT/$expr/"
            done
            echo "-- Auto thumbnails --"
            python -m trend_discovery.main thumbnails \
              --pipeline "$RB_OUTPUT" \
              --output "$RB_OUTPUT/thumbnails" || true
          elif [ "$MODE" = "adobe-stock-preview" ]; then
            FOCUS_ARG=""
            [ -n "${{ github.event.inputs.focus }}" ] && FOCUS_ARG="--focus '${{ github.event.inputs.focus }}'"
            eval python -m trend_discovery.main preview --market adobe_stock --output ./reports/adobe_stock $FOCUS_ARG
          elif [ "$MODE" = "adobe-stock-generate" ]; then
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            AS_REPORT=$(ls -t ./reports/adobe_stock/cahiers_des_charges_*.json 2>/dev/null | head -1)
            [ -z "$AS_REPORT" ] && echo "ERREUR : aucun rapport Adobe Stock." && exit 1
            eval python -m trend_discovery.main generate-all --yes --report "$AS_REPORT" --output ./output/adobe_stock $LIMIT_ARG
            python -m trend_discovery.main thumbnails --pipeline ./output/adobe_stock --output ./output/adobe_stock/thumbnails || true
          elif [ "$MODE" = "etsy-preview" ]; then
            FOCUS_ARG=""
            [ -n "${{ github.event.inputs.focus }}" ] && FOCUS_ARG="--focus '${{ github.event.inputs.focus }}'"
            eval python -m trend_discovery.main preview --market etsy --output ./reports/etsy $FOCUS_ARG
          elif [ "$MODE" = "etsy-generate" ]; then
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            ET_REPORT=$(ls -t ./reports/etsy/cahiers_des_charges_*.json 2>/dev/null | head -1)
            [ -z "$ET_REPORT" ] && echo "ERREUR : aucun rapport Etsy." && exit 1
            eval python -m trend_discovery.main generate-all --yes --report "$ET_REPORT" --output ./output/etsy $LIMIT_ARG
            python -m trend_discovery.main thumbnails --pipeline ./output/etsy --output ./output/etsy/thumbnails || true
          elif [ "$MODE" = "audit" ]; then
            python -m trend_discovery.main audit
          elif [ "$MODE" = "archive" ]; then
            [ -z "${{ github.event.inputs.niche }}" ] && echo "ERREUR : input niche requis." && exit 1
            eval python -m trend_discovery.main archive --niche "'${{ github.event.inputs.niche }}'"
          elif [ "$MODE" = "generate-all" ]; then
            NICHE_ARG=""
            LIMIT_ARG=""
            [ -n "${{ github.event.inputs.niche }}" ] && NICHE_ARG="--niche '${{ github.event.inputs.niche }}'"
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            eval python -m trend_discovery.main generate-all --yes $NICHE_ARG $LIMIT_ARG
            python -m trend_discovery.main thumbnails --pipeline ./output/spoonflower --colorways ./output/colorways --uploads ./output/uploads/base --output ./output/thumbnails
          elif [ "$MODE" = "generate-best" ]; then
            NICHE_ARG=""
            LIMIT_ARG=""
            [ -n "${{ github.event.inputs.niche }}" ] && NICHE_ARG="--niche '${{ github.event.inputs.niche }}'"
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            eval python -m trend_discovery.main generate --best --yes $NICHE_ARG $LIMIT_ARG
          elif [ "$MODE" = "generate-elements" ]; then
            NICHE_ARG=""
            [ -n "${{ github.event.inputs.niche }}" ] && NICHE_ARG="--niche '${{ github.event.inputs.niche }}'"
            eval python -m trend_discovery.main generate-elements --yes $NICHE_ARG
          elif [ "$MODE" = "colorize" ]; then
            PALETTE_ARG=""
            [ -n "${{ github.event.inputs.palettes }}" ] && PALETTE_ARG="--palettes '${{ github.event.inputs.palettes }}'"
            eval python -m trend_discovery.main colorize --yes --smart --input ./output/spoonflower --output ./output/colorways --reports ./reports $PALETTE_ARG
            eval python -m trend_discovery.main colorize --yes --smart --input ./output/redbubble --output ./output/colorways --reports ./reports/redbubble $PALETTE_ARG || true
            eval python -m trend_discovery.main colorize --yes --input ./output/uploads/base --output ./output/uploads/colorways $PALETTE_ARG || true
            python -m trend_discovery.main thumbnails --pipeline ./output/spoonflower --colorways ./output/colorways --uploads ./output/uploads/base --output ./output/thumbnails
          elif [ "$MODE" = "bg-remove" ]; then
            python -m trend_discovery.main bg-remove --yes --input ./output/redbubble --output ./output/redbubble
            python -m trend_discovery.main thumbnails --pipeline ./output/redbubble --colorways ./output/colorways --uploads ./output/uploads/base --output ./output/thumbnails
          elif [ "$MODE" = "seamless-audit" ]; then
            python -m trend_discovery.main seamless-audit --yes --overwrite --input ./output/spoonflower --output ./output/spoonflower
            python -m trend_discovery.main seamless-audit --yes --overwrite --input ./output/uploads/base --output ./output/uploads/base || true
          elif [ "$MODE" = "text-apply" ]; then
            mkdir -p output/redbubble_with_text
            python -m trend_discovery.main text-apply --images ./output/redbubble --reports ./reports/redbubble --output ./output/redbubble_with_text
          elif [ "$MODE" = "text-fix" ]; then
            mkdir -p output/redbubble_fixed
            python -m trend_discovery.main text-fix --images ./output/redbubble --reports ./reports/redbubble --output ./output/redbubble_fixed
            python -m trend_discovery.main thumbnails --pipeline ./output/redbubble_fixed --output ./output/thumbnails || true
          elif [ "$MODE" = "assemble" ]; then
            VARIANTS_VAL="${{ github.event.inputs.limit || '3' }}"
            [ "$VARIANTS_VAL" = "0" ] && VARIANTS_VAL="3"
            mkdir -p output/spoonflower
            python -m trend_discovery.main assemble --yes --input ./output/redbubble --output ./output/spoonflower --background navy --variants "$VARIANTS_VAL"
            python -m trend_discovery.main assemble --yes --input ./output/redbubble --output ./output/spoonflower --background ivory --variants "$VARIANTS_VAL"
            python -m trend_discovery.main thumbnails --pipeline ./output/spoonflower --output ./output/thumbnails || true
          elif [ "$MODE" = "listings" ]; then
            mkdir -p reports/listings
            python -m trend_discovery.main listings --reports ./reports --spoonflower ./output/spoonflower --colorways ./output/colorways --uploads ./output/uploads/base --uploads-colorways ./output/uploads/colorways --redbubble ./output/redbubble --redbubble-reports ./reports/redbubble --output ./reports/listings
          elif [ "$MODE" = "thumbnails" ]; then
            python -m trend_discovery.main thumbnails --pipeline ./output/spoonflower --colorways ./output/colorways --uploads ./output/uploads/base --output ./output/thumbnails
          elif [ "$MODE" = "upscale-fix" ]; then
            rm -f reports/upscale_debug.log
            LIMIT_ARG=""
            LIMIT_VAL="${{ github.event.inputs.limit || '0' }}"
            [ "$LIMIT_VAL" != "0" ] && LIMIT_ARG="--limit $LIMIT_VAL"
            python -m trend_discovery.generators.upscale_existing --input ./output/spoonflower --commit-every 8 $LIMIT_ARG
            python -m trend_discovery.generators.upscale_existing --input ./output/uploads/base --commit-every 8 $LIMIT_ARG || true
            python -m trend_discovery.main thumbnails --pipeline ./output/spoonflower --colorways ./output/colorways --uploads ./output/uploads/base --output ./output/thumbnails
          elif [ "$MODE" = "recover-artifact" ]; then
            python -m trend_discovery.generators.recover_artifact --artifact-dir ./_recovered --subdirs output/spoonflower,output/redbubble,output/uploads/base
            python -m trend_discovery.main thumbnails --pipeline ./output/spoonflower --colorways ./output/colorways --uploads ./output/uploads/base --output ./output/thumbnails
          elif [ "$MODE" = "generate" ]; then
            python -m trend_discovery.main generate \
              --manifest "${{ inputs.manifest_path }}" \
              --approve "${{ inputs.approved_niches }}" \
              --images ${{ inputs.images_per_niche || '5' }} \
              --yes
          else
            ARGS=""
            [ -n "${{ github.event.inputs.keywords }}"   ] && ARGS="$ARGS --keywords '${{ github.event.inputs.keywords }}'"
            [ -n "${{ github.event.inputs.categories }}" ] && ARGS="$ARGS --categories '${{ github.event.inputs.categories }}'"
            [ "${{ github.event.inputs.fast_mode }}" = "true" ] && ARGS="$ARGS --fast"
            [ -n "${{ github.event.inputs.depth }}" ] && ARGS="$ARGS --depth ${{ github.event.inputs.depth }}"
            eval python -m trend_discovery.main $ARGS
          fi

      - name: Commit et push des rapports + images
        run: |
          git config user.name  "Moneymaker Bot"
          git config user.email "bot@moneymaker.auto"
          DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          push_with_retry() {
            DELAY=2
            for attempt in 1 2 3 4; do
              git pull --rebase --autostash origin HEAD && git push origin HEAD && return 0
              echo "Échec push (attempt $attempt/4) — retry dans ${DELAY}s"
              sleep $DELAY
              DELAY=$((DELAY * 2))
            done
            return 1
          }
          for d in output/rb_*/*/; do
            [ -d "$d" ] || continue
            git add "$d"
            if ! git diff --staged --quiet; then
              git commit -m "report(images): $(basename $(dirname $d))/$(basename $d) — ${DATE}"
              push_with_retry || echo "ATTENTION: push échoué pour $d"
            fi
          done
          git add reports/ output/ data/approvals/ 2>/dev/null || git add reports/ output/
          if git diff --staged --quiet; then
            echo "Aucun nouveau rapport."
          else
            git commit -m "report(pipeline): trends + images — ${DATE}"
            push_with_retry || echo "ATTENTION: push final échoué"
          fi

      - name: Upload artefacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moneymaker-${{ github.run_number }}
          path: |
            reports/
            output/spoonflower/
            output/redbubble/
            output/redbubble_idioms/
            output/rb_*/
            output/redbubble_fixed/
            output/redbubble_with_text/
            output/adobe_stock/
            output/etsy/
            output/colorways/
            output/uploads/colorways/
            output/thumbnails/
          retention-days: 90
